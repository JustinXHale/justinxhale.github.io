# Site basics
title: "Justin X. Hale's Portfolio"
description: "Senior UX / Product Designer: enterprise platform UX, AI/ML surfaces, design systems, and published products"
remote_theme: "just-the-docs/just-the-docs"

# IMPORTANT for project pages (your repo is not a user/org site)
url: "https://justinxhale.github.io"
baseurl: ""

# Look & feel (optional)
# logo and favicon omitted until assets/icon-512.png is added

# Navigation / behavior
permalink: pretty
aux_links_new_tab: true

# Back to top button
back_to_top: true
back_to_top_text: "Back to top"

# Footer links removed (stub pages not yet created)

# Plugins
plugins:
  - jekyll-github-metadata

# Do not turn README into a page at /assets/resume/ (was cluttering nav)
exclude:
  - docs
  - assets/resume/README.md
  - vendor

# trigger rebuilds on changes to these files